server {
    listen 80;
    server_name validate.samantafluture.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name validate.samantafluture.com;

    ssl_certificate /etc/letsencrypt/live/validate.samantafluture.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/validate.samantafluture.com/privkey.pem;

    # API — signup and survey endpoints
    # Use variable so nginx starts even when the API container is down
    resolver 127.0.0.11 valid=30s;
    set $api_upstream http://cherrykit-api:3848;

    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static landing pages — one folder per experiment
    location / {
        root /usr/share/nginx/cherrykit;
        index index.html;
        try_files $uri $uri/ $uri/index.html =404;
    }
}
