name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: deploy-cherrykit
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            echo "No lockfile yet — skipping install"
          fi

      - name: Typecheck
        run: |
          if [ -d src ] && [ -f pnpm-lock.yaml ]; then
            pnpm exec tsc --noEmit
          else
            echo "No source code yet — skipping typecheck"
          fi

  deploy:
    name: Deploy
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: 187.124.67.117
          username: sam
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: cd ~/apps/cherrykit && bash scripts/deploy.sh
